<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Sturij — Pairing Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- studio-preview.html — the drop preview only (branch preview/design-drop-2026-08-15).
     Frames the archive's studio.html exactly as served at /studio and, from outside it, appends
     one stylesheet (preview-overrides.css) into the framed document. No archive file is edited;
     /studio stays the archive verbatim. -->
<style>
  html, body { margin: 0; height: 100%; background: #1D1D1D; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<iframe id="studio" src="/studio" title="Sturij — Pairing Studio (the archive)"
        allow="clipboard-read; clipboard-write; web-share; microphone; fullscreen" allowfullscreen></iframe>
<script>
(function () {
  var f = document.getElementById('studio');
  function isStudio(d) {
    try { var p = d.location.pathname; return p === '/studio' || p === '/studio.html'; } catch (e) { return false; }
  }
  function inject() {
    try {
      var d = f.contentDocument;
      if (!d || !d.head || !isStudio(d)) return false;
      if (d.getElementById('preview-overrides')) return true;
      var l = d.createElement('link');
      l.id = 'preview-overrides'; l.rel = 'stylesheet'; l.href = '/preview-overrides.css';
      d.head.appendChild(l);
      return true;
    } catch (e) { return false; }
  }
  /* as early as the framed head exists, then again on every load of the frame (the switcher navigates it) */
  var t = setInterval(function () { if (inject()) clearInterval(t); }, 16);
  f.addEventListener('load', function () {
    inject();
    try { if (f.contentDocument && f.contentDocument.title) document.title = f.contentDocument.title; } catch (e) {}
    var t2 = setInterval(function () { if (inject()) clearInterval(t2); }, 16);
    setTimeout(function () { clearInterval(t2); }, 4000);
  });
  setTimeout(function () { clearInterval(t); }, 8000);
})();
</script>
</body>
</html>
