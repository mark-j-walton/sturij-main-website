<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sturij — Specimen board 3D (Framer export)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Self-contained component page for Framer import. No frameworks. */
body{margin:0;background:#F7F4EE;color:#1D1D1D;font-family:'IBM Plex Mono',monospace;padding:40px;display:flex;flex-direction:column;gap:28px;align-items:flex-start}
.lbl{font:500 9.5px 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#62584F}

/* ── container card (K1): floats, minimises, resizes; never dominates ── */
#card{position:relative;width:680px;border-radius:16px;background-color:#FDFCF8;transition:background-color .4s;box-shadow:0 2px 4px rgba(35,31,27,.08),0 18px 44px rgba(35,31,27,.18)}
#stage{position:relative;height:520px;border-radius:16px;background-image:radial-gradient(rgba(29,29,29,.09) 1px,transparent 1px);background-size:26px 26px;cursor:grab;touch-action:none;perspective:1400px}
#stage:active{cursor:grabbing}
#board{position:absolute;left:50%;top:52%;width:0;height:0;transform-style:preserve-3d}
#board.settle{transition:transform .5s cubic-bezier(.22,1,.36,1)}
.face{position:absolute;left:50%;top:50%;background-color:#5f4430}
#caption{position:absolute;left:16px;bottom:12px;z-index:10;font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#8d8177;text-shadow:0 1px 0 rgba(253,252,248,.8)}

/* embossed control (P1) */
.ctl{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;background:#FDFCF8;color:rgba(98,88,79,.8);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1.5px 2px rgba(255,255,255,.85),inset 0 -1.5px 2.5px rgba(35,31,27,.16),0 1px 3px rgba(35,31,27,.14);transition:box-shadow .14s,color .14s;font-size:12px}
.ctl:hover{color:#1D1D1D}
.ctl:active{box-shadow:inset 0 2px 4px rgba(35,31,27,.22),inset 0 -1px 1px rgba(255,255,255,.5)}
#minBtn{position:absolute;top:10px;right:10px;z-index:11}

/* resize grip — embossed lines, bottom right */
#grip{position:absolute;right:0;bottom:0;width:30px;height:30px;cursor:nwse-resize;z-index:11}
#grip::after{content:"";position:absolute;right:7px;bottom:7px;width:15px;height:15px;background:linear-gradient(135deg,transparent calc(50% - 2px),rgba(35,31,27,.32) calc(50% - 2px) calc(50% - .5px),rgba(255,255,255,.85) calc(50% - .5px) calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(135deg,transparent calc(78% - 2px),rgba(35,31,27,.32) calc(78% - 2px) calc(78% - .5px),rgba(255,255,255,.85) calc(78% - .5px) calc(78% + 1px),transparent calc(78% + 1px))}

/* slick light slider — hairline track, gold knob, no chrome */
#lightCtl{position:absolute;right:18px;top:50%;transform:translateY(-50%);height:220px;width:26px;z-index:11;display:flex;flex-direction:column;align-items:center;cursor:pointer}
#lightCtl .sun{font-size:9px;color:#62584F;line-height:1;padding:2px 0}
#lightCtl .sun.dim{opacity:.45}
#ltrack{position:relative;flex:1;width:26px}
#ltrack::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1.5px;margin-left:-.75px;border-radius:2px;background:linear-gradient(180deg,rgba(98,88,79,.45),rgba(98,88,79,.18))}
#lknob{position:absolute;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#D4A01B;box-shadow:0 1px 3px rgba(35,31,27,.3),inset 0 1px 1.5px rgba(255,255,255,.45);cursor:grab}
#lknob:active{cursor:grabbing}

/* swatch chip — draggable; while on the board it locks the container colour */
#chip{position:absolute;top:14px;left:14px;z-index:12;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:grab;user-select:none;touch-action:none}
#chip:active{cursor:grabbing}
#chip .frame{display:block;background:#FDFCF8;border-radius:14px;padding:6px;box-shadow:0 4px 12px rgba(35,31,27,.18),inset 0 0 0 1px rgba(35,31,27,.05)}
#chip .fillc{display:block;width:64px;height:46px;border-radius:9px;background:#E7DFD3;box-shadow:inset 0 1px 2px rgba(35,31,27,.12)}
#chip.locked .fillc{outline:2px solid #D4A01B;outline-offset:2px}

/* minimised pill */
#pill{display:none;align-items:center;gap:10px;height:44px;border-radius:999px;background:#FDFCF8;padding:0 10px 0 18px;box-shadow:0 2px 4px rgba(35,31,27,.08),0 14px 30px rgba(35,31,27,.2)}
#pill span{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#62584F}
body.min #card{display:none}
body.min #pill{display:flex}
</style>
</head>
<body>
<span class="lbl">Sturij · specimen board — drag to tilt · right-drag / shift-drag pulls closer or away · chip locks the colour while it sits on the card</span>

<div id="card">
  <div id="stage">
    <div id="board" class="settle">
      <div class="face" id="fTop"><div id="gloss"></div></div>
      <div class="face" id="fFront"><div class="band"></div></div>
      <div class="face" id="fBack"><div class="band"></div></div>
      <div class="face" id="fLeft"><div class="band"></div></div>
      <div class="face" id="fRight"><div class="band"></div></div>
    </div>
    <div id="shadow"></div>
    <div id="caption">Alba walnut · Egger · 18mm on MDF</div>
    <div id="chip"><span class="frame"><span class="fillc"></span></span><span class="lbl" style="font-size:8.5px">Light cashmere</span></div>
    <div id="lightCtl"><span class="sun">☀</span><div id="ltrack"><div id="lknob"></div></div><span class="sun dim">☀</span></div>
  </div>
  <button class="ctl" id="minBtn" title="Put away">−</button>
  <div id="grip" title="Resize"></div>
</div>

<div id="pill"><span>Specimen board</span><button class="ctl" id="openBtn" title="Open">⌄</button></div>

<script>
(function(){
var IMG='https://raw.githubusercontent.com/mark-j-walton/sturij-main-website/main/showcase/finishes/alba-walnut.webp';
/* For Framer: replace IMG with your hosted texture, or a Framer asset URL. */
var W=400,D=400,T=44;
var st={rx:62,ry:0,tz:0,light:70,scale:1,locked:false};
var board=document.getElementById('board'),gloss=document.getElementById('gloss');
var card=document.getElementById('card'),stage=document.getElementById('stage');

/* faces */
function face(el,w,h,xform,extra){el.style.width=w+'px';el.style.height=h+'px';el.style.margin=(-h/2)+'px 0 0 '+(-w/2)+'px';el.style.transform=xform;if(extra)el.style.cssText+=extra;}
face(document.getElementById('fTop'),W,D,'translateZ('+(T/2-.5)+'px)','');
var ft=document.getElementById('fTop');
ft.style.backgroundImage='url('+IMG+')';ft.style.backgroundSize='cover';ft.style.backgroundPosition='center';
face(document.getElementById('fFront'),W,T,'rotateX(-90deg) translateZ('+(D/2)+'px)');
face(document.getElementById('fBack'),W,T,'rotateX(-90deg) rotateY(180deg) translateZ('+(D/2)+'px)');
face(document.getElementById('fLeft'),D,T,'rotateX(-90deg) rotateY(-90deg) translateZ('+(W/2)+'px)');
face(document.getElementById('fRight'),D,T,'rotateX(-90deg) rotateY(90deg) translateZ('+(W/2)+'px)');
document.querySelectorAll('.face .band').forEach(function(b){
  b.style.cssText='position:absolute;left:50%;top:50%;width:'+(T+3)+'px;height:'+(W+3)+'px;margin:'+(-(W+3)/2)+'px 0 0 '+(-(T+3)/2)+'px;transform:rotate(90deg);background-image:linear-gradient(90deg,rgba(35,31,27,.1),rgba(35,31,27,0) 30%,rgba(35,31,27,.16)),url('+IMG+');background-size:100% 100%,cover;background-position:center';
});
document.querySelectorAll('.face').forEach(function(f){f.style.overflow='hidden';});
gloss.style.cssText='position:absolute;inset:0;pointer-events:none';
var sh=document.getElementById('shadow');
sh.style.cssText='position:absolute;left:50%;bottom:74px;transform:translateX(-50%);width:340px;height:44px;border-radius:50%;filter:blur(6px);pointer-events:none';

function apply(){
  var L=st.light/70;
  board.style.transform='translateZ('+st.tz+'px) rotateX('+st.rx+'deg) rotateZ('+st.ry+'deg)';
  var bf=(.72+L*.28);
  ft.style.filter='contrast('+(.88+L*.2)+') saturate('+(.92+L*.12)+') brightness('+(.94+(L-1)*.1)+')';
  var bs=[['fFront',1],['fBack',.82],['fLeft',.9],['fRight',.86]];
  bs.forEach(function(p){document.getElementById(p[0]).style.filter='brightness('+(bf*p[1]).toFixed(3)+')';});
  /* light band that catches the grain — plain gradients, no blend modes (they die inside 3D) */
  var glossA=Math.max(0,Math.min(.75,((90-st.rx)/90*.55+.18)*L));
  var gx=50-st.ry*1.2, gy=30-(st.rx-62)*.8;
  gloss.style.background=
    'radial-gradient(760px 240px ellipse at '+gx+'% '+gy+'%,rgba(255,246,224,'+glossA.toFixed(3)+'),rgba(255,246,224,'+(glossA*.22).toFixed(3)+') 48%,transparent 72%),'+
    'linear-gradient('+(205-st.ry).toFixed(1)+'deg,transparent 46%,rgba(35,31,27,'+(glossA*.55).toFixed(3)+'))';
  sh.style.background='radial-gradient(closest-side,rgba(35,31,27,'+(.32-st.tz/900).toFixed(2)+'),transparent 72%)';
  var kn=document.getElementById('lknob'),tr=document.getElementById('ltrack');
  kn.style.top=((1-(st.light-20)/130)*(tr.offsetHeight-16))+'px';
}

/* tilt + depth drag */
stage.addEventListener('contextmenu',function(e){e.preventDefault();});
stage.addEventListener('pointerdown',function(e){
  if(e.target.closest('#chip,#lightCtl,#minBtn,#grip'))return;
  e.preventDefault();stage.setPointerCapture(e.pointerId);
  var depth=e.button===2||e.shiftKey;
  var s={x:e.clientX,y:e.clientY,rx:st.rx,ry:st.ry,tz:st.tz};
  board.classList.remove('settle');
  function mv(ev){
    if(depth)st.tz=Math.max(-420,Math.min(175,s.tz-(ev.clientY-s.y)*.8));
    else{st.rx=Math.max(18,Math.min(88,s.rx-(ev.clientY-s.y)*.25));st.ry=s.ry+(ev.clientX-s.x)*.3;}
    apply();
  }
  function up(){board.classList.add('settle');window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);}
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
});

/* slick slider */
(function(){
  var tr=document.getElementById('ltrack');
  function setFromY(cy){var r=tr.getBoundingClientRect();var f=1-Math.max(0,Math.min(1,(cy-r.top-8)/(r.height-16)));st.light=20+f*130;apply();}
  document.getElementById('lightCtl').addEventListener('pointerdown',function(e){
    e.stopPropagation();e.preventDefault();setFromY(e.clientY);
    function mv(ev){setFromY(ev.clientY);}
    function up(){window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);}
    window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
  });
})();

/* chip: drag anywhere; ON the card = colour locked; dragged off = unlock + revert */
(function(){
  var chip=document.getElementById('chip');
  chip.addEventListener('pointerdown',function(e){
    e.stopPropagation();e.preventDefault();chip.setPointerCapture(e.pointerId);
    var r=chip.getBoundingClientRect(),sr=stage.getBoundingClientRect();
    var ox=e.clientX-r.left,oy=e.clientY-r.top,moved=false;
    function mv(ev){moved=true;
      chip.style.left=(ev.clientX-sr.left-ox)+'px';chip.style.top=(ev.clientY-sr.top-oy)+'px';
      var inside=ev.clientX>sr.left&&ev.clientX<sr.right&&ev.clientY>sr.top&&ev.clientY<sr.bottom;
      chip.style.opacity=inside?1:.45;
    }
    function up(ev){window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);
      var inside=ev.clientX>sr.left&&ev.clientX<sr.right&&ev.clientY>sr.top&&ev.clientY<sr.bottom;
      if(!moved){return;}
      st.locked=inside;chip.classList.toggle('locked',inside);chip.style.opacity=1;
      card.style.backgroundColor=inside?'#E7DFD3':'#FDFCF8';
      if(!inside){chip.style.left='14px';chip.style.top='14px';}
    }
    window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
  });
})();

/* minimise / restore */
document.getElementById('minBtn').onclick=function(){document.body.classList.add('min');};
document.getElementById('openBtn').onclick=function(){document.body.classList.remove('min');};

/* resize grip: scales the whole card proportionally (content never distorts) */
(function(){
  var grip=document.getElementById('grip');
  grip.addEventListener('pointerdown',function(e){
    e.stopPropagation();e.preventDefault();
    var sw=card.offsetWidth,sx=e.clientX;
    function mv(ev){
      var w=Math.max(340,Math.min(980,sw+(ev.clientX-sx)));
      card.style.width=w+'px';var k=w/680;
      stage.style.height=(520*k)+'px';
      stage.style.perspective=(1400*k)+'px';
      board.style.scale=k;
    }
    function up(){window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);}
    window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
  });
})();

apply();window.addEventListener('resize',apply);
})();
</script>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#F7F4EE"/><rect x="30" y="38" width="40" height="24" rx="2" fill="#7a5a3d" transform="skewX(-12)"/></svg></template>
</body>
</html>
