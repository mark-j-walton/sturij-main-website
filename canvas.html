<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sturij — Canvas</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="brand/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="studio.css">
<link rel="stylesheet" href="canvas.css">
</head>
<body class="board">
<header class="top">
  <div class="toprow">
    <a class="b" href="studio.html"><img src="brand/sturij-logo-white.png" alt="Sturij"></a>
    <button class="projpill" id="projpill" title="Switch project"></button>
    <div class="tr">
      <button class="hbtn" id="cvSwatches" title="Place swatches from your studio scheme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg><span>Swatches</span></button>
      <button class="hbtn" id="cvUpload" title="Add photos — or just drag files onto the board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><span>Photos</span></button>
      <button class="hbtn" id="cvPlan" title="Draw a floor plan — walls snap to 45° and 50mm, like the visualiser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4h16v16H4z"/><path d="M4 12h8M12 12v8"/></svg><span>Plan</span></button>
      <button class="hbtn" id="cvWall" title="Add a wall — set its colour from your swatches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3 10h18M8 10v9M16 5v5"/></svg><span>Wall</span></button>
      <button class="hbtn" id="cvRoom" title="Add a live-view room card — colour it from your swatches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8l4 3v6M21 8l-4 3v6M7 11h10M7 17h10"/></svg><span>Room</span></button>
      <button class="hbtn" id="cvNote" title="Peel a note onto the board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v9l-5 5H5a1 1 0 0 1-1-1V5z"/><path d="M15 19v-5h5"/></svg><span>Note</span></button>
      <button class="hbtn" id="cvFurn" title="Top-down furniture — drag pieces onto the board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 18v-6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6"/><path d="M4 18h16M7 10V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3"/></svg><span>Furniture</span></button>
      <button class="hbtn" id="cvText" title="Add text to the board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 6V4h14v2M12 4v16m-3 0h6"/></svg><span>Text</span></button>
      <button class="hbtn" id="cvPin" title="Drop a pin — attach photos from the library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21s-7-7.6-7-12a7 7 0 1 1 14 0c0 4.4-7 12-7 12z"/><circle cx="12" cy="9" r="2.6"/></svg><span>Pin</span></button>
      <button class="hbtn" id="cvLib" title="Project image library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M21 8v9a2 2 0 0 1-2 2h-9M6.5 14.5l3-3 2.5 2.5 2-2 2.5 2.5"/></svg><span>Library</span></button>
      <button class="hbtn" id="cvExport" title="Download the board as an image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4v12m0 0l-4-4m4 4l4-4"/><path d="M4 18v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1"/></svg><span>Export</span></button>
      <button class="hbtn" id="cvInfo" title="Room information — paint calculator, guides"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8v.5"/></svg><span>Info</span></button>
      <button class="hbtn" id="cvTrade" title="Generate a trade plan — plumber, electrician, joiner, flooring, decorator, plasterer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14M4 20h16M9 20v-5h6v5"/><path d="M8 9h3m2 0h3"/></svg><span>Trade plan</span></button>
      <button class="hbtn" id="cvPresent" title="Build a client presentation from the walls on this board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M12 16v4m-4 0h8"/></svg><span>Present</span></button>
      <button class="hbtn" id="cvUndo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>Undo</span></button>
      <button class="hbtn" id="cvRedo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg><span>Redo</span></button>
      <button class="hbtn" id="cvClear" title="Clear the board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 7h14M10 7V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2m-7 0l1 13h8l1-13"/></svg><span>Clear</span></button>
      <a class="hbtn" href="studio.html" title="Back to the Pairing Studio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 6l-6 6 6 6"/></svg><span>Studio</span></a>
    </div>
  </div>
  <div class="cbar"><div class="cbside"><span class="cbhint" id="cvHint">Drag to pan &middot; scroll to zoom &middot; drop photos anywhere</span></div></div>
</header>
<div class="world" id="world"><div class="plane" id="plane"></div></div>
<div class="docktray" id="docktray" aria-label="Docked docs"></div>
<div class="furnpal libleft" id="libpal" hidden><div class="fph"><span>Library</span><button id="lbx">×</button></div><div class="lpg" id="lpg"></div></div>
<div class="furnpal" id="furnpal" hidden><div class="fph"><span>Furniture</span><button id="fpx">×</button></div><div class="fpcats" id="fpcats"></div><div class="fpg" id="fpg"></div></div>
<div class="ctxbar" id="ctxbar" aria-label="Selection tools">
  <button data-a="saver">Saver backdrop</button><button data-a="unstk">Unstack</button><button data-a="rot">Rotate</button><button data-a="fdim">Size</button><button data-a="lock">Lock</button><button data-a="front">Front</button><button data-a="back">Back</button><button data-a="dup">Duplicate</button>
  <span class="tctl"><button data-a="font" title="Cycle typeface">Aa</button><button data-a="sizedn">A−</button><button data-a="sizeup">A+</button></span>
  <button data-a="pal">Palette</button><button data-a="frame">Card</button><button data-a="dock">Dock</button><button data-a="pub">Publish</button><button data-a="appr">Approve</button><button data-a="vis">Visualise</button><button data-a="tovis">Visualiser</button><button data-a="enh">Enhance</button><button data-a="restyle">Restyle</button><button data-a="export">Export</button><button data-a="del" class="danger">Delete</button>
</div>
<div class="swtray" id="swtray" aria-label="Studio swatches"><div class="swhd">From your studio scheme</div><div class="swrow" id="swrow"></div></div>
<input type="file" id="cvFile" accept="image/*" multiple hidden>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/motion@11.13.5/dist/motion.js" defer></script>
<script src="progress-ui.js"></script>
<script src="canvas.js"></script>
<script src="canvas-fx.js"></script>
<script src="canvas-menu.js"></script>
<script src="chat-core.js"></script>
<script src="canvas-chat.js"></script>
<script src="canvas-saver.js"></script>
</body>
</html>
