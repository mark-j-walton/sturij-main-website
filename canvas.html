<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sturij — Canvas</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="brand/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="studio.css">
<link rel="stylesheet" href="canvas.css">
</head>
<body class="board">
<header class="top">
  <div class="toprow">
    <a class="b" href="studio.html"><img src="brand/sturij-logo-white.png" alt="Sturij"></a>
    <div class="tr">
      <button class="hbtn" id="cvSwatches" title="Place swatches from your studio scheme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg><span>Swatches</span></button>
      <button class="hbtn" id="cvUpload" title="Add photos — or just drag files onto the board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><span>Photos</span></button>
      <button class="hbtn" id="cvPlan" title="Draw a floor plan — walls snap to 45° and 50mm, like the visualiser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4h16v16H4z"/><path d="M4 12h8M12 12v8"/></svg><span>Plan</span></button>
      <button class="hbtn" id="cvWall" title="Add a wall — set its colour from your swatches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3 10h18M8 10v9M16 5v5"/></svg><span>Wall</span></button>
      <button class="hbtn" id="cvNote" title="Peel a note onto the board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v9l-5 5H5a1 1 0 0 1-1-1V5z"/><path d="M15 19v-5h5"/></svg><span>Note</span></button>
      <button class="hbtn" id="cvExport" title="Download the board as an image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4v12m0 0l-4-4m4 4l4-4"/><path d="M4 18v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1"/></svg><span>Export</span></button>
      <button class="hbtn" id="cvClear" title="Clear the board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 7h14M10 7V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2m-7 0l1 13h8l1-13"/></svg><span>Clear</span></button>
      <a class="hbtn" href="studio.html" title="Back to the Pairing Studio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 6l-6 6 6 6"/></svg><span>Studio</span></a>
    </div>
  </div>
  <div class="cbar"><div class="cbside"><span class="cbhint" id="cvHint">Drag to pan &middot; scroll to zoom &middot; drop photos anywhere</span></div></div>
</header>
<div class="world" id="world"><div class="plane" id="plane"></div></div>
<div class="swtray" id="swtray" aria-label="Studio swatches"><div class="swhd">From your studio scheme</div><div class="swrow" id="swrow"></div></div>
<input type="file" id="cvFile" accept="image/*" multiple hidden>
<div class="toast" id="toast" role="status"></div>
<script src="canvas.js"></script>
</body>
</html>
