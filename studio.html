<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sturij — Pairing Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#232120;--gold:#a67c3c;--bronze:#6e2a2e;--paper:#faf7f0;--paper-warm:#f3eee3;--card:#fbf9f3;--ink:#34312a;--ink-body:#34312a;--ink-muted:#66615a;--line:rgba(52,49,42,.14);--nav:56px;--f-serif:'DM Serif Display',Georgia,serif;--f-sans:'DM Sans',system-ui,sans-serif;--f-mono:'IBM Plex Mono',monospace}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;font-family:var(--f-sans);color:var(--ink-body);background:var(--navy);overflow:hidden;-webkit-font-smoothing:antialiased}
  .top{position:fixed;inset:0 0 auto 0;height:var(--nav);z-index:30;background:var(--navy);color:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,3vw,26px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  .top .b{font-family:var(--f-serif);font-size:21px;text-decoration:none;color:var(--paper)}.top .b i{color:var(--gold);font-style:normal}
  .top .t{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(250,248,242,.66)}
  .top a.x{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);text-decoration:none;border:1px solid var(--gold);border-radius:999px;padding:6px 13px}
  .wrap{position:fixed;inset:var(--nav) 0 0 0;display:grid;grid-template-columns:1fr 1fr}
  .side{position:relative;overflow:hidden}
  .rail{position:absolute;inset:0;touch-action:none;cursor:grab;user-select:none}
  .rail.grabbing{cursor:grabbing}
  .track{position:absolute;left:0;right:0;top:0;will-change:transform}
  .strip{height:66px;position:relative;border-bottom:1px solid rgba(0,0,0,.06);background-size:cover;background-position:center}
  .lab{position:absolute;bottom:9px;max-width:74%;background:rgba(26,23,20,.22);color:#fff;border-radius:9px;overflow:hidden;transition:background .2s,color .2s,opacity .35s;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .paint .lab{left:14px}.board .lab{right:14px;text-align:right}
  .lab .nm{display:block;padding:6px 13px;font:600 11px/1.3 var(--f-mono);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lab .add{display:block;max-height:0;overflow:hidden;text-align:center;font:600 10px/26px var(--f-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--navy);background:var(--gold);transition:max-height .2s}
  .strip:hover .lab,.strip.hot .lab{background:rgba(253,252,248,.94);color:var(--ink)}
  .strip:hover .lab .add,.strip.hot .lab .add{max-height:26px}
  .lab.added{opacity:0}
  .colhint{position:absolute;top:10px;left:0;right:0;z-index:5;text-align:center;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(250,248,242,.6);pointer-events:none;mix-blend-mode:difference}
  .filled{position:absolute;inset:0;display:none;align-items:flex-end;background-size:cover;background-position:center}
  .side.chosen .filled{display:flex}.side.chosen .rail{display:none}.side.chosen .colhint{display:none}
  .filled .fn{font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:14px 16px;margin:16px;border-radius:9px;background:rgba(253,252,248,.9);color:var(--ink)}
  .board.side .filled .fn{background:rgba(26,23,20,.55);color:#fff}
  .change{position:absolute;top:14px;right:14px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(26,23,20,.5);border:1px solid rgba(250,248,242,.4);border-radius:999px;padding:7px 12px;cursor:pointer}
  .paint.side .change{color:var(--ink);background:rgba(253,252,248,.8);border-color:var(--line)}
  .bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);z-index:26;display:none;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px;box-shadow:0 12px 34px rgba(0,0,0,.3);opacity:0;transition:opacity .4s,transform .4s}
  .bar.on{display:flex;opacity:1;transform:translateX(-50%)}
  .bar button{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-sans);font-weight:600;font-size:13.5px;border:1px solid var(--line);background:var(--paper);color:var(--ink-body);border-radius:999px;padding:9px 15px;cursor:pointer}
  .bar button.p{background:var(--navy);border-color:var(--navy);color:var(--paper)}
  .bar button svg{display:block}
  .handles{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:24;display:none;align-items:center;gap:18px}
  .handles.on{display:flex}
  .handles .hbtn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(250,248,242,.5);background:rgba(26,23,20,.4);color:#fff;font-size:20px;cursor:pointer}
  .hview{width:min(60vw,520px);height:180px;display:flex;align-items:center;justify-content:center;position:relative}
  .hview svg{filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
  .hname{position:absolute;bottom:-30px;left:0;right:0;text-align:center;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#fff}
  .suggest{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:16px clamp(12px,3vw,26px) 18px;background:linear-gradient(to top,rgba(26,23,20,.55),transparent);display:none;opacity:0;transition:opacity .8s ease}
  .suggest.on{display:block}.suggest.show{opacity:1}
  .suggest .sx{position:absolute;top:4px;right:14px;width:30px;height:30px;border-radius:50%;border:1px solid rgba(250,248,242,.5);background:rgba(26,23,20,.5);color:#fff;font-size:12px;cursor:pointer}
  .suggest .sh{font-family:var(--f-mono);font-weight:600;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#fff;margin:0 0 10px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
  .srow{display:flex;gap:11px;overflow-x:auto;padding-bottom:4px}
  .scard{flex:none;width:144px;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.4);cursor:pointer;transition:transform .2s}
  .scard:hover{transform:translateY(-3px)}
  .scard .si{height:92px;background-size:cover;background-position:center}
  .scard .sn{padding:8px 10px;font-family:var(--f-mono);font-weight:600;font-size:10.5px;color:var(--ink)}
  .tray{position:fixed;right:14px;top:calc(var(--nav) + 12px);z-index:27;width:min(260px,72vw);background:rgba(253,252,248,.96);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.28);display:none;flex-direction:column;max-height:70vh}
  .tray.on{display:flex}
  .tray h4{margin:0;padding:12px 14px 6px;font-family:var(--f-mono);font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
  .items{overflow-y:auto;padding:4px 10px}
  .item{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line)}
  .item .sw{width:40px;height:30px;border-radius:5px;border:1px solid var(--line);background-size:cover;background-position:center;flex:none}
  .item .meta{font-family:var(--f-mono);font-size:10px;line-height:1.35;color:var(--ink-body);overflow:hidden}
  .item .meta b{display:block;font-size:10.5px;color:var(--ink)}
  .item .meta span{color:var(--ink-muted)}
  .item .rm{margin-left:auto;border:0;background:none;color:var(--ink-muted);cursor:pointer;font-size:14px}
  .tray .foot{padding:10px 12px;border-top:1px solid var(--line)}
  .tray .zip{width:100%;font-family:var(--f-sans);font-weight:600;font-size:13px;color:var(--navy);background:var(--gold);border:0;border-radius:10px;padding:11px;cursor:pointer}
  .tray .foot .n{display:block;text-align:center;font-family:var(--f-mono);font-size:9px;color:var(--ink-muted);margin-top:6px}
  .toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:60;background:var(--navy);color:var(--paper);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;padding:9px 14px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.on{opacity:1}
  /* ===== room options tab (under nav, above paints) ===== */
  .opts{position:fixed;top:calc(var(--nav) + 10px);left:12px;z-index:22;font-family:var(--f-mono)}
  .opts .otab{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:rgba(253,252,248,.92);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.16)}
  .opts .otab .cv{transition:transform .2s}.opts.open .otab .cv{transform:rotate(180deg)}
  .opts-menu{margin-top:8px;display:none;background:rgba(253,252,248,.98);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 32px rgba(0,0,0,.22);padding:6px;min-width:184px}
  .opts.open .opts-menu{display:block}
  .opts-menu label{display:flex;align-items:center;gap:10px;padding:9px 11px;font-size:11px;letter-spacing:.03em;color:var(--ink);cursor:pointer;border-radius:8px}
  .opts-menu label:hover{background:var(--paper-warm)}
  .opts-menu label .px{margin-left:auto;opacity:.5;font-size:9.5px}
  .orow{display:flex;align-items:center;gap:10px;padding:8px 11px}
  .orow .ol{font-size:11px;color:var(--ink);min-width:44px}
  .orow .fseg{flex:1}
  .opts-menu input{accent-color:var(--bronze);width:15px;height:15px;flex:none}
  /* ===== room (paint side split) ===== */
  #fillPaint{position:absolute;inset:0;padding:0;display:none}
  .side.chosen #fillPaint{display:block}
  .room{position:absolute;inset:0;display:flex;flex-direction:column}
  .rcols{flex:1;min-height:0;display:flex}
  .rfloor{height:clamp(70px,18vh,180px);position:relative;background-size:cover;background-position:center;box-shadow:inset 0 3px 6px rgba(0,0,0,.14)}
  .rcol{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid rgba(0,0,0,.10)}
  .rcol:last-child{border-right:0}
  .rband{position:relative;cursor:pointer}.rcols{cursor:pointer}
  .rtsel{outline:2px solid var(--gold);outline-offset:-2px;z-index:2}
  .rceil{height:clamp(80px,24vh,200px);background:#f5f2ea}
  .rwall{flex:1;position:relative;background:#ece6da}
  .rskirt{height:clamp(64px,20vh,200px);background:#fbf9f3;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
  .rzoff{opacity:.55}
  .rnm{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);font:600 10px/1.3 var(--f-mono);letter-spacing:.02em;color:#fff;background:rgba(26,23,20,.34);padding:5px 9px;border-radius:8px;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .roomtools{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;gap:8px;justify-content:center;padding:14px}
  .roomtools .rt{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:rgba(253,252,248,.9);border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.16)}
  .roomtools .rt.add{color:var(--navy);background:var(--gold);border-color:var(--gold)}
  .wallpick,.floorpick{display:none;padding:2px 8px 8px;margin:-2px 0 4px}
  .opts-menu.showwall .wallpick{display:block}.opts-menu.showfloor .floorpick{display:block}
  .fseg{display:flex;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
  .fseg button{flex:1;font:600 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);background:transparent;border:0;padding:8px 0;cursor:pointer}
  .fseg button.on{color:var(--paper);background:var(--bronze)}
  .fchips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;max-height:196px;overflow-y:auto;padding-right:2px}
  .fchip{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background-size:cover;cursor:pointer}
  .fchip.on{outline:2px solid var(--bronze);outline-offset:1px}
  #floorpick .fchips{display:none}   /* floor now chosen from the bottom rail */
  /* ===== floor coverings: horizontal rail along the bottom ===== */
  .floorbar{position:fixed;left:0;right:0;bottom:0;z-index:23;height:84px;display:none;background:var(--navy);box-shadow:0 -3px 16px rgba(0,0,0,.34)}
  .floorbar.on{display:block}
  body.hasfloor .bar{bottom:104px}body.hasfloor .pad{bottom:100px}body.hasfloor .roomtools{bottom:92px}
  .fhint{position:absolute;top:5px;left:0;right:0;text-align:center;font:600 9px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:rgba(250,248,242,.55);pointer-events:none;z-index:2}
  .frail{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none}
  .frail.grabbing{cursor:grabbing}
  .ftrack{position:absolute;top:0;bottom:0;left:0;display:flex;will-change:transform}
  .ftile{width:122px;flex:none;background-size:cover;background-position:center;border-right:1px solid rgba(0,0,0,.28);position:relative}
  .ftile .fl{position:absolute;left:8px;bottom:7px;font:600 9px/1.2 var(--f-mono);letter-spacing:.03em;color:#fff;background:rgba(0,0,0,.42);padding:4px 8px;border-radius:6px;max-width:86%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fexp{position:absolute;inset:0;display:none;background-size:cover;background-position:center;align-items:center;justify-content:space-between;padding:0 18px}
  .floorbar.filled .frail,.floorbar.filled .fhint{display:none}.floorbar.filled .fexp{display:flex}
  .fexp .fn{font:600 11px/1 var(--f-mono);letter-spacing:.05em;color:#fff;background:rgba(0,0,0,.48);padding:10px 14px;border-radius:8px}
  .fexp .fchg{font:600 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:9px 14px;cursor:pointer}
  /* ===== properties cog + modal ===== */
  .cog{position:fixed;right:14px;bottom:16px;z-index:29;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(253,252,248,.9);color:var(--ink);font-size:16px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.2)}
  body.hasfloor .cog{bottom:100px}
  .modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(26,23,20,.38);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  .modal.on{display:flex}
  .mcard{width:min(460px,92vw);max-height:86vh;overflow-y:auto;background:var(--paper);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.5);font-family:var(--f-sans);color:var(--ink)}
  .mhead{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
  .mhead h3{margin:0;font-family:var(--f-serif);font-size:19px}
  .mhead button{border:0;background:none;font-size:16px;cursor:pointer;color:var(--ink-muted)}
  .msec{padding:14px 18px;border-bottom:1px solid var(--line)}
  .msec h4{margin:0 0 10px;font:600 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
  .split{display:flex;align-items:center;gap:10px;font:600 11px var(--f-mono)}
  .split input[type=range]{flex:1;accent-color:var(--bronze)}
  .grid2{display:flex;gap:10px;margin-top:12px}
  .gcell{flex:1;border:1px dashed var(--line);border-radius:8px;padding:10px;text-align:center}
  .gcell label{display:block;font:600 9px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:6px}
  .gcell input{width:74px;text-align:center;font:600 14px var(--f-mono);border:1px solid var(--line);border-radius:6px;padding:6px}
  .gcell input:disabled{background:var(--paper-warm);color:var(--ink-muted)}
  .mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:0}
  .mrow .ml{display:flex;align-items:center;gap:8px;font-size:13px;min-width:120px}
  .mrow .brands{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap}
  .mrow .brands label{display:flex;align-items:center;gap:5px;font:600 10px var(--f-mono);color:var(--ink-muted)}
  .mrow input{accent-color:var(--bronze)}
  .mfoot{padding:14px 18px;display:flex;justify-content:flex-end}
  .mfoot button{font:600 13px var(--f-sans);color:var(--navy);background:var(--gold);border:0;border-radius:10px;padding:10px 22px;cursor:pointer}
  /* ===== peel-off post-it tag ===== */
  .pad{position:fixed;left:16px;bottom:18px;z-index:28;width:126px;height:92px;cursor:grab;font-family:var(--f-mono)}
  .pad .sheet{position:absolute;inset:0;background:#efe3c4;border-radius:3px;box-shadow:0 5px 14px rgba(0,0,0,.22)}
  .pad .sheet:first-child{transform:rotate(-3.5deg)}.pad .sheet:nth-child(2){transform:rotate(2.5deg)}
  .pad .top{position:absolute;inset:0;z-index:2;background:#f6edd6;background-image:linear-gradient(135deg,rgba(255,255,255,.5),rgba(0,0,0,.04));border-radius:3px;box-shadow:0 9px 20px rgba(0,0,0,.26);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;overflow:hidden}
  .pad .top .wm,.note .wm{background:url('/brand/sturij-mark-white.png') center/contain no-repeat;filter:brightness(0)}
  .pad .top .wm{width:30px;height:30px;opacity:.32}
  .pad .top .pl{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:#8a5a2e}
  .pad:active{cursor:grabbing}
  .note{position:fixed;z-index:40;width:152px;min-height:98px;padding:12px 13px 11px;background:#f5ecd6;background-image:linear-gradient(135deg,rgba(255,255,255,.55),rgba(0,0,0,.045));border-radius:2px;box-shadow:0 11px 26px rgba(0,0,0,.32);overflow:hidden;font-family:var(--f-mono);transform:rotate(-4deg)}
  .note .wm{position:absolute;inset:0;background-size:52%;opacity:.09;pointer-events:none}
  .note .tape{position:absolute;top:-7px;left:50%;transform:translateX(-50%) rotate(-2deg);width:50px;height:15px;background:rgba(206,184,140,.55);box-shadow:0 1px 3px rgba(0,0,0,.14)}
  .note .brand{position:relative;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#9a6a34}
  .note .nm{position:relative;font-size:13px;font-weight:600;color:#34312a;margin-top:5px;line-height:1.25}
  .note .meta{position:relative;margin-top:9px;font-size:8px;letter-spacing:.06em;color:#9a938686;color:#9c948a}
  .note .curl{position:absolute;right:0;bottom:0;width:22px;height:22px;background:linear-gradient(135deg,transparent 46%,rgba(0,0,0,.13) 50%,rgba(255,255,255,.5) 55%);border-bottom-right-radius:2px}
  .note.drag{pointer-events:none;opacity:.97;transform:rotate(-6deg) scale(1.02)}
  .note.stuck{cursor:pointer}
  @media(max-width:560px){.strip{height:58px}.pad{width:104px;height:78px}}
</style>
</head>
<body>
<header class="top">
  <a class="b" href="/">sturij<i>.</i></a>
  <span class="t">Pairing studio</span>
  <a class="x" href="/">Close</a>
</header>

<div class="opts" id="opts">
  <button class="otab" id="otab">◧ Room options <span class="cv">▾</span></button>
  <div class="opts-menu">
    <div class="orow"><span class="ol">Walls</span><div class="fseg" id="wallseg"><button data-w="paint" class="on">Paint</button><button data-w="wallpaper">Wallpaper</button></div></div>
    <label><input type="checkbox" id="zc"> Ceiling <span class="px">200px</span></label>
    <label><input type="checkbox" id="zs"> Skirting <span class="px">200px</span></label>
    <label><input type="checkbox" id="zf"> Floor</label>
    <div class="floorpick" id="floorpick"><div class="fseg" id="floorseg"><button data-t="hard" class="on">Hard</button><button data-t="soft">Carpet</button></div></div>
    <label><input type="checkbox" id="zt" checked> Post-it tags</label>
  </div>
</div>

<div class="wrap">
  <div class="side paint" id="sidePaint">
    <div class="colhint" id="colhint">Wall · tap to add · compare colours</div>
    <div class="rail" id="railPaint"><div class="track"></div></div>
    <div class="filled" id="fillPaint"><span class="fn"></span><button class="change" data-k="paint">⟳ change</button></div>
  </div>
  <div class="side board" id="sideBoard">
    <div class="colhint">Boards · drag · tap to fill</div>
    <div class="rail" id="railBoard"><div class="track"></div></div>
    <div class="filled" id="fillBoard"><span class="fn"></span><button class="change" data-k="board">⟳ change</button></div>

function rail(sideEl, railEl, kind, items, paint){
  var track=railEl.querySelector('.track'), SH=(window.innerWidth<560?58:66);
  function strip(it,i){
    var bg = paint ? 'background:'+it[1] : "background-image:url('/showcase/finishes/"+it.s+".webp')";
    var nm = paint ? it[0] : it.n;
    var brand = paint ? 'Farrow &amp; Ball' : 'Egger';

  }
  track.innerHTML=items.map(function(it,i){return strip(it,i);}).concat(items.map(function(it,i){return strip(it,i);})).join('');
  var H=items.length*SH, y=0, dragging=false, lastY=0, vy=0, moved=0, raf=null;
  function apply(){var w=((y%H)+H)%H;track.style.transform='translateY('+(-w)+'px)';}
  railEl.addEventListener('wheel',function(e){e.preventDefault();y+=e.deltaY;apply();},{passive:false});
  railEl.addEventListener('pointerdown',function(e){dragging=true;lastY=e.clientY;vy=0;moved=0;if(raf)cancelAnimationFrame(raf);railEl.setPointerCapture(e.pointerId);railEl.classList.add('grabbing');});
  railEl.addEventListener('pointermove',function(e){if(!dragging)return;var dy=e.clientY-lastY;lastY=e.clientY;vy=dy;moved+=Math.abs(dy);y-=dy;apply();});
  function momentum(){vy*=0.93;if(Math.abs(vy)<0.4)return;y-=vy;apply();raf=requestAnimationFrame(momentum);}
  railEl.addEventListener('pointerup',function(e){if(!dragging)return;dragging=false;railEl.classList.remove('grabbing');
    if(moved<6){ tap(e.clientX,e.clientY); } else momentum(); });
  railEl.addEventListener('pointercancel',function(){dragging=false;railEl.classList.remove('grabbing');});
  function tap(x,yy){
    var t=document.elementFromPoint(x,yy); if(!t)return;
    var addBtn=t.closest('.add'); var st=t.closest('.strip'); if(!st)return;
    var i=parseInt(st.getAttribute('data-i'))%items.length; var it=items[i];
    if(addBtn){ addSwatch(kind,it); var lab=st.querySelector('.lab'); lab.classList.add('added'); setTimeout(function(){lab.classList.remove('added');},420); }
    else { fillSide(kind,it); }
  }
}

function renderFloorRail(){var track=el('frail')&&el('frail').querySelector('.ftrack');if(!track)return;track.innerHTML='';FLOORS[floorType].forEach(function(fl){var t=document.createElement('div');t.className='ftile';t.style.backgroundImage="url('"+fl.url+"')";t.setAttribute('data-tag','');t.setAttribute('data-brand',floorType==='hard'?'Egger':'Crucial Trading');t.setAttribute('data-name',fl.name);t.innerHTML='<span class="fl">'+fl.name+'</span>';t.addEventListener('click',function(){if(fmoved>6)return;floor=fl;el('floorbar').classList.add('filled');var ex=el('fexp');ex.style.backgroundImage="url('"+fl.url+"')";ex.querySelector('.fn').textContent=(floorType==='hard'?'Egger':'Crucial Trading')+' · '+fl.name;if(el('sidePaint').classList.contains('chosen'))renderRoom();});track.appendChild(t);});}

(function(){var rail=el('frail'),track=rail.querySelector('.ftrack'),x=0,down=false,lx=0,vx=0,raf=null;
  function ap(){track.style.transform='translateX('+x+'px)';}
  function clamp(){var min=Math.min(0,rail.clientWidth-track.scrollWidth);if(x>0)x=0;if(x<min)x=min;}
  rail.addEventListener('wheel',function(e){e.preventDefault();x-=(e.deltaY+e.deltaX);clamp();ap();},{passive:false});
  rail.addEventListener('pointerdown',function(e){down=true;lx=e.clientX;fmoved=0;vx=0;if(raf)cancelAnimationFrame(raf);rail.setPointerCapture(e.pointerId);rail.classList.add('grabbing');});
  rail.addEventListener('pointermove',function(e){if(!down)return;var dx=e.clientX-lx;lx=e.clientX;vx=dx;fmoved+=Math.abs(dx);x+=dx;clamp();ap();});
  function mom(){vx*=0.92;if(Math.abs(vx)<0.4)return;x+=vx;clamp();ap();raf=requestAnimationFrame(mom);}
  rail.addEventListener('pointerup',function(){if(!down)return;down=false;rail.classList.remove('grabbing');mom();});
  rail.addEventListener('pointercancel',function(){down=false;rail.classList.remove('grabbing');});
})();

}

el('cam').onclick=function(){pairPNG(function(cv){items.push({name:'Room — '+(sel.paint?sel.paint[0]:'')+' + '+(sel.board?sel.board.n:''),file:pairName()+'.png',sub:'room photo',swatchCss:'background:'+(sel.paint?sel.paint[1]:'#ccc'),png:cv.toDataURL('image/png')});renderTray();toast('Photo added to zip');});};
el('addpair').onclick=function(){pairPNG(function(cv){items.push({name:sel.paint[0]+' + '+sel.board.n,file:pairName()+'.png',sub:'pairing',swatchCss:'background:'+sel.paint[1],png:cv.toDataURL('image/png')});renderTray();toast('Added pairing');});};

function showSuggest(){if(!bothChosen())return;var row=el('srow');row.innerHTML='';
  var picks=BOARDS.filter(function(b){return b.s!==sel.board.s;}).sort(function(){return Math.random()-.5;}).slice(0,6);
  picks.forEach(function(b){var c=document.createElement('div');c.className='scard';
    c.innerHTML='<div class="si" style="background-image:url(\'/showcase/finishes/'+b.s+'.webp\')"></div><div class="sn">'+b.n+'</div>';
    c.onclick=function(){fillSide('board',b);showSuggest();};row.appendChild(c);});
  var sg=el('suggest');sg.classList.add('on');requestAnimationFrame(function(){sg.classList.add('show');});}
el('sx').onclick=function(){var sg=el('suggest');sg.classList.remove('show');setTimeout(function(){sg.classList.remove('on');},600);};

var CRC=(function(){var t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){var c=0xFFFFFFFF;for(var i=0;i<u8.length;i++)c=CRC[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function dataURLtoU8(d){var b=atob(d.split(',')[1]);var u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function zip(files){var chunks=[],central=[],offset=0;
  function w16(v){return[v&255,(v>>8)&255];}function w32(v){return[v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255];}
  files.forEach(function(f){var name=[];for(var i=0;i<f.name.length;i++)name.push(f.name.charCodeAt(i));var data=f.data,c=crc32(data);
    var lh=[].concat(w32(0x04034b50),w16(20),w16(0),w16(0),w16(0),w16(0),w32(c),w32(data.length),w32(data.length),w16(name.length),w16(0),name);
    chunks.push(new Uint8Array(lh));chunks.push(data);
    central.push(new Uint8Array([].concat(w32(0x02014b50),w16(20),w16(20),w16(0),w16(0),w16(0),w16(0),w32(c),w32(data.length),w32(data.length),w16(name.length),w16(0),w16(0),w16(0),w16(0),w32(0),w32(offset),name)));
    offset+=lh.length+data.length;});
  var csize=central.reduce(function(a,b){return a+b.length;},0);
  var end=new Uint8Array([].concat(w32(0x06054b50),w16(0),w16(0),w16(files.length),w16(files.length),w32(csize),w32(offset),w16(0)));
  var all=chunks.concat(central,[end]),total=all.reduce(function(a,b){return a+b.length;},0),out=new Uint8Array(total),p=0;
  all.forEach(function(u){out.set(u,p);p+=u.length;});return out;}
el('bzip').onclick=function(){
  if(!items.length){toast('Shortlist is empty');return;}
  var files=items.map(function(s){return {name:s.file,data:dataURLtoU8(s.png)};});
  fetch('/sturij-about.pdf').then(function(r){return r.ok?r.arrayBuffer():null;}).catch(function(){return null;}).then(function(buf){
    if(buf) files.push({name:'about-sturij.pdf',data:new Uint8Array(buf)});
    var blob=new Blob([zip(files)],{type:'application/zip'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sturij-pairings.zip';a.click();toast('Zip downloaded');
  });
};

/* ===== peel-off post-it tag: drag from pad, drop on a finish ===== */
(function(){
  var pad=el('pad'); if(!pad) return;
  function noteHTML(brand,name,meta){return '<div class="wm"></div><span class="tape"></span><div class="brand">'+brand+'</div><div class="nm">'+name+'</div><div class="meta">'+(meta||'Sturij')+'</div><div class="curl"></div>';}
  function tagOf(node){ if(!node) return null; var t=node.closest&&node.closest('[data-tag]'); if(!t) return null; var nm=t.getAttribute('data-name'); if(!nm) return null; return {brand:t.getAttribute('data-brand')||'Sturij',name:nm}; }
  pad.addEventListener('pointerdown',function(e){
    e.preventDefault(); try{pad.setPointerCapture(e.pointerId);}catch(_){}
    var note=document.createElement('div'); note.className='note drag';
    note.innerHTML=noteHTML('Sturij','Drop on a finish…','peel &amp; place');
    document.body.appendChild(note);
    function place(cx,cy){note.style.left=(cx-76)+'px';note.style.top=(cy-50)+'px';}
    place(e.clientX,e.clientY);
    function mv(ev){place(ev.clientX,ev.clientY);}
    function up(ev){
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
      note.style.display='none';
      var under=document.elementFromPoint(ev.clientX,ev.clientY); note.remove();
      var info=tagOf(under);
      if(info){
        var s=document.createElement('div'); s.className='note stuck';
        s.innerHTML=noteHTML(info.brand,info.name,'Sturij · tap ✕');
        s.style.left=(ev.clientX-76)+'px'; s.style.top=(ev.clientY-50)+'px';
        s.style.transform='rotate('+(((ev.clientX%9)-4)).toFixed(0)+'deg)';
        s.onclick=function(){s.remove();};
        document.body.appendChild(s); toast('Tagged · '+info.name);
      } else toast('Drop it on a colour, board or floor');
    }
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
  });
})();
/* ===== properties modal (the hidden cog) ===== */
(function(){
  var MATS=[{k:'walls',label:'Walls',brands:['Farrow & Ball']},{k:'ceiling',label:'Ceiling',brands:['Farrow & Ball']},{k:'skirting',label:'Skirting',brands:['Farrow & Ball']},{k:'wood',label:'Wood / boards',brands:['Egger']},{k:'floor',label:'Floor',brands:['Egger','Crucial Trading']},{k:'worktop',label:'Worktop',brands:['Omega Stone']},{k:'tags',label:'Post-it tags',brands:[]}];
  var props={split:50,mats:{},brands:{}};
  MATS.forEach(function(m){props.mats[m.k]=true;m.brands.forEach(function(b){props.brands[b]=true;});});
  try{var sv=JSON.parse(localStorage.getItem('sturij-studio-props')||'null');if(sv){if(sv.split)props.split=sv.split;Object.assign(props.mats,sv.mats||{});Object.assign(props.brands,sv.brands||{});}}catch(_){}
  function showLabel(id,on){var e=el(id);if(e&&e.closest('label'))e.closest('label').style.display=on?'':'none';}
  function applyProps(){
    var w=document.querySelector('.wrap');if(w)w.style.gridTemplateColumns=props.split+'% '+(100-props.split)+'%';
    showLabel('zc',props.mats.ceiling);showLabel('zs',props.mats.skirting);showLabel('zf',props.mats.floor);showLabel('zt',props.mats.tags);
    if(el('pad'))el('pad').style.display=(props.mats.tags&&el('zt')&&el('zt').checked)?'':'none';
    if(el('sideBoard'))el('sideBoard').style.display=props.mats.wood?'':'none';
  }
  function buildMat(){var box=el('matlist');box.innerHTML='';MATS.forEach(function(m){var row=document.createElement('div');row.className='mrow';
    var bh=m.brands.map(function(b){return '<label><input type="checkbox" data-brand="'+b+'" '+(props.brands[b]?'checked':'')+'> '+b+'</label>';}).join('');
    row.innerHTML='<span class="ml"><input type="checkbox" data-mat="'+m.k+'" '+(props.mats[m.k]?'checked':'')+'> '+m.label+'</span><div class="brands">'+bh+'</div>';box.appendChild(row);});}
  el('cog').onclick=function(){el('splitr').value=props.split;el('cw0').value=props.split;el('cw1').value=100-props.split;buildMat();el('modal').classList.add('on');};
  el('mx').onclick=function(){el('modal').classList.remove('on');};
  el('modal').addEventListener('click',function(e){if(e.target===el('modal'))el('modal').classList.remove('on');});
  el('splitr').oninput=function(){el('cw0').value=this.value;el('cw1').value=100-this.value;};
  el('cw0').oninput=function(){var v=Math.max(10,Math.min(90,parseInt(this.value)||50));el('splitr').value=v;el('cw1').value=100-v;};
  el('msave').onclick=function(){props.split=parseInt(el('splitr').value)||50;
    [].forEach.call(el('matlist').querySelectorAll('[data-mat]'),function(c){props.mats[c.getAttribute('data-mat')]=c.checked;});
    [].forEach.call(el('matlist').querySelectorAll('[data-brand]'),function(c){props.brands[c.getAttribute('data-brand')]=c.checked;});
    try{localStorage.setItem('sturij-studio-props',JSON.stringify(props));}catch(_){}
    applyProps();el('modal').classList.remove('on');toast('Properties saved');};
  applyProps();
})();
</script>
