<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sturij — Pairing Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#20384a;--gold:#d4aa58;--bronze:#8b5e2c;--paper:#faf8f2;--paper-warm:#f0ece4;--card:#fdfcf8;--ink:#241f1a;--ink-body:#3d3830;--ink-muted:#6b6358;--line:rgba(35,31,27,.14);--nav:60px;--f-serif:'DM Serif Display',Georgia,serif;--f-sans:'DM Sans',system-ui,sans-serif;--f-mono:'IBM Plex Mono',monospace}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;font-family:var(--f-sans);color:var(--ink-body);background:var(--paper);overflow:hidden;-webkit-font-smoothing:antialiased}
  .top{position:fixed;inset:0 0 auto 0;height:var(--nav);z-index:30;background:var(--navy);color:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,3vw,26px)}
  .top .b{font-family:var(--f-serif);font-size:22px;text-decoration:none;color:var(--paper)}.top .b i{color:var(--gold);font-style:normal}
  .top .t{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(250,248,242,.7)}
  .top a.x{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);text-decoration:none;border:1px solid var(--gold);border-radius:999px;padding:7px 14px}
  .cols{position:fixed;inset:var(--nav) 0 0 0;display:grid;grid-template-columns:1fr 1fr}
  .col{position:relative;overflow:hidden;touch-action:none;cursor:grab;user-select:none}
  .col.grabbing{cursor:grabbing}
  .col .track{position:absolute;left:0;right:0;top:0;will-change:transform}
  .col.paint{}
  .strip{height:64px;display:flex;align-items:center;padding:0 clamp(12px,2vw,22px);position:relative;border-bottom:1px solid rgba(0,0,0,.06)}
  .strip .lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;font-weight:600;background:rgba(253,252,248,.86);color:var(--ink);padding:4px 8px;border-radius:5px;pointer-events:none;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .strip.board{background-size:cover;background-position:center}
  .strip.board .lab{background:rgba(16,26,34,.55);color:#fff}
  .strip.sel{box-shadow:inset 0 0 0 3px var(--gold)}
  .colhead{position:absolute;top:10px;left:0;right:0;z-index:5;text-align:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);pointer-events:none}
  .paint .colhead{color:var(--ink-muted)}
  /* dock */
  .dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:25;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px rgba(35,31,27,.18);max-width:94vw}
  .dock .pick{display:flex;align-items:center;gap:8px;min-width:120px}
  .dock .sw{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background-size:cover;background-position:center;flex:none}
  .dock .nm{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.03em;line-height:1.25;color:var(--ink-body)}
  .dock .nm b{display:block;color:var(--ink-muted);font-weight:600;font-size:9px;text-transform:uppercase;letter-spacing:.1em}
  .dock button{font-family:var(--f-sans);font-weight:600;font-size:14px;color:var(--paper);background:var(--navy);border:0;border-radius:10px;padding:11px 18px;cursor:pointer}
  .dock button:disabled{opacity:.4;cursor:default}
  .hint{position:fixed;top:calc(var(--nav) + 12px);left:50%;transform:translateX(-50%);z-index:8;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);background:rgba(253,252,248,.8);padding:6px 12px;border-radius:999px;pointer-events:none;transition:opacity .5s}
  /* stage */
  .stage{position:fixed;inset:0;z-index:40;display:none;background:var(--navy)}
  .stage.on{display:block}
  .stage .half{position:absolute;top:0;bottom:0;width:50%;display:flex;align-items:flex-end;overflow:hidden}
  .stage .lp{left:0}.stage .rp{right:0;background-size:cover;background-position:center}
  .stage .cap{font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:16px 18px;margin:14px;border-radius:8px}
  .stage .lp .cap{background:rgba(253,252,248,.85);color:var(--ink)}
  .stage .rp .cap{background:rgba(16,26,34,.55);color:#fff}
  .stbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:44;display:flex;gap:8px;background:rgba(253,252,248,.94);border:1px solid var(--line);border-radius:999px;padding:7px 8px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .stbar button{font-family:var(--f-sans);font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink-body);border-radius:999px;padding:8px 14px;cursor:pointer}
  .stbar button.p{background:var(--navy);border-color:var(--navy);color:var(--paper)}
  .stbar button.g{background:var(--gold);border-color:var(--gold);color:var(--navy)}
  /* handle carousel */
  .handles{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:43;display:none;align-items:center;gap:18px}
  .handles.on{display:flex}
  .handles .hbtn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(250,248,242,.5);background:rgba(16,26,34,.4);color:#fff;font-size:20px;cursor:pointer}
  .handles .hview{width:min(60vw,520px);height:180px;display:flex;align-items:center;justify-content:center}
  .handles .hview svg{filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))}
  .handles .hname{position:absolute;bottom:-34px;left:0;right:0;text-align:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff}
  /* shortlist */
  .tray{position:fixed;right:14px;bottom:14px;z-index:45;display:none;flex-direction:column;gap:8px;align-items:flex-end}
  .tray.on{display:flex}
  .tray .thumbs{display:flex;gap:6px;max-width:60vw;overflow-x:auto;padding:6px;background:rgba(253,252,248,.94);border:1px solid var(--line);border-radius:12px}
  .tray img{height:52px;border-radius:6px;border:1px solid var(--line)}
  .tray .zip{font-family:var(--f-sans);font-weight:600;font-size:13px;color:var(--navy);background:var(--gold);border:0;border-radius:10px;padding:10px 16px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2)}
  @media(max-width:560px){.dock .nm{display:none}.strip{height:56px}}
  .suggest{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:16px clamp(12px,3vw,26px) 20px;background:linear-gradient(to top,rgba(16,26,34,.55),transparent);display:none;opacity:0;transition:opacity .8s ease}
  .suggest.on{display:block}.suggest.show{opacity:1}
  .suggest .sx{position:absolute;top:6px;right:14px;width:32px;height:32px;border-radius:50%;border:1px solid rgba(250,248,242,.5);background:rgba(16,26,34,.5);color:#fff;font-size:13px;cursor:pointer}
  .suggest .sh{font-family:var(--f-mono);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#fff;margin:0 0 12px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
  .srow{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
  .scard{flex:none;width:150px;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.4);cursor:pointer;transition:transform .2s}
  .scard:hover{transform:translateY(-3px)}
  .scard .si{height:96px;background-size:cover;background-position:center}
  .scard .sn{padding:9px 11px;font-family:var(--f-mono);font-weight:600;font-size:11px;letter-spacing:.03em;color:var(--ink)}
</style>
</head>
<body>
<header class="top">
  <a class="b" href="/">sturij<i>.</i></a>
  <span class="t">Pairing studio</span>
  <a class="x" href="/">Close</a>
</header>

<div class="cols">
  <div class="col paint" id="cpaint"><div class="colhead">Paint · drag to scroll</div><div class="track"></div></div>
  <div class="col board" id="cboard"><div class="colhead">Boards · drag to scroll</div><div class="track"></div></div>
</div>

<div class="hint" id="hint">Drag each side · tap a paint and a board</div>

<div class="dock">
  <div class="pick"><span class="sw" id="dpsw"></span><span class="nm"><b>Paint</b><span id="dpnm">—</span></span></div>
  <div class="pick"><span class="sw" id="dbsw"></span><span class="nm"><b>Board</b><span id="dbnm">—</span></span></div>
  <button id="combine" disabled>Combine →</button>
</div>

<div class="stage" id="stage">
  <div class="half lp" id="lp"><div class="cap" id="lpc"></div></div>
  <div class="half rp" id="rp"><div class="cap" id="rpc"></div></div>
</div>
<div class="handles" id="handles"><button class="hbtn" id="hprev">‹</button><div class="hview" id="hview"></div><button class="hbtn" id="hnext">›</button><div class="hname" id="hname"></div></div>
<div class="suggest" id="suggest"><button class="sx" id="sx">✕</button><div class="sh">Egger suggests · complementary decors</div><div class="srow" id="srow"></div></div>
<div class="stbar" id="stbar" style="display:none">
  <button id="bhandles">Handles</button>
  <button class="p" id="bsnap">Snapshot</button>
  <button id="bshort">Shortlist +</button>
  <button id="bclose">Back</button>
</div>

<div class="tray" id="tray"><div class="thumbs" id="thumbs"></div><button class="zip" id="bzip">Download zip</button></div>

<script>
var BOARDS=[{"s": "alba-walnut", "n": "Alba Walnut"}, {"s": "beige-ambiance-granite", "n": "Beige Ambiance Granite"}, {"s": "black-ambiance-granite", "n": "Black Ambiance Granite"}, {"s": "black-ambiance-marble", "n": "Black Ambiance Marble"}, {"s": "bookmatch-oak", "n": "Bookmatch Oak"}, {"s": "brighton-chestnut", "n": "Brighton Chestnut"}, {"s": "brown-bolivar-wood", "n": "Brown Bolivar Wood"}, {"s": "caramel-beige", "n": "Caramel Beige"}, {"s": "cassis", "n": "Cassis"}, {"s": "champagne-crossed-metal", "n": "Champagne Crossed Metal"}, {"s": "dark-berry", "n": "Dark Berry"}, {"s": "deep-blue", "n": "Deep Blue"}, {"s": "estate-green", "n": "Estate Green"}, {"s": "graphite-sheffield-acacia", "n": "Graphite Sheffield Acacia"}, {"s": "havanna-grey", "n": "Havanna Grey"}, {"s": "light-natural-rovato-oak", "n": "Light Natural Rovato Oak"}, {"s": "monument-grey", "n": "Monument Grey"}, {"s": "natural-bolivar-wood", "n": "Natural Bolivar Wood"}, {"s": "natural-dimaro-walnut", "n": "Natural Dimaro Walnut"}, {"s": "pebble-grey-calcit-stone", "n": "Pebble Grey Calcit Stone"}, {"s": "reed-green", "n": "Reed Green"}, {"s": "sand-beige-calcit-stone", "n": "Sand Beige Calcit Stone"}, {"s": "sand-casella-oak", "n": "Sand Casella Oak"}, {"s": "soft-beige", "n": "Soft Beige"}, {"s": "taormina-travertine", "n": "Taormina Travertine"}], FB=[["Wimborne White", "#f2ece0"], ["Pointing", "#efe9d8"], ["Skimming Stone", "#d5cec2"], ["Cornforth White", "#d3ccc0"], ["Ammonite", "#d0cabc"], ["Elephant's Breath", "#cebfb0"], ["Setting Plaster", "#e4c9c0"], ["Dead Salmon", "#b18d7f"], ["Sulking Room Pink", "#c9a29a"], ["Purbeck Stone", "#cbc0b0"], ["Pigeon", "#8d9084"], ["Mole's Breath", "#98938c"], ["Plummett", "#8f9691"], ["Pavilion Gray", "#b6b1a8"], ["Lamp Room Gray", "#b7b6ae"], ["Down Pipe", "#56585a"], ["Railings", "#43474a"], ["Off-Black", "#38393b"], ["Hague Blue", "#2f3f4a"], ["Stiffkey Blue", "#43536a"], ["De Nimes", "#6b7c8b"], ["Inchyra Blue", "#4f5d5d"], ["Oval Room Blue", "#84948f"], ["Green Smoke", "#6c7671"], ["Card Room Green", "#767c6b"], ["Bancha", "#5c5b45"], ["Studio Green", "#33413a"], ["Lichen", "#9a998a"], ["French Gray", "#a9a897"], ["Cromarty", "#cfd2c7"], ["Borrowed Light", "#dde5e2"], ["Pale Powder", "#d6ded5"], ["Light Blue", "#a4ada2"], ["Dix Blue", "#a4b1ab"], ["India Yellow", "#c48a3f"], ["Babouche", "#e6b64a"], ["Sudbury Yellow", "#dcae63"], ["Charlotte's Locks", "#e15e26"], ["Preference Red", "#7d3a34"], ["Brinjal", "#5a4247"], ["Tanner's Brown", "#4b3d33"], ["London Clay", "#6b5d53"]];
function el(id){return document.getElementById(id)}

/* ---------- infinite drag columns ---------- */
function column(colEl, items, renderStrip, onPick){
  var track=colEl.querySelector('.track'), SH=64;
  track.innerHTML=items.concat(items).map(function(it,i){return renderStrip(it,i%items.length);}).join('');
  var H=items.length*SH, y=0, dragging=false, lastY=0, vy=0, moved=0, raf=null;
  function apply(){var w=((y%H)+H)%H;track.style.transform='translateY('+(-w)+'px)';}
  colEl.addEventListener('wheel',function(e){e.preventDefault();y+=e.deltaY;apply();},{passive:false});
  colEl.addEventListener('pointerdown',function(e){dragging=true;lastY=e.clientY;vy=0;moved=0;colEl.setPointerCapture(e.pointerId);colEl.classList.add('grabbing');if(raf)cancelAnimationFrame(raf);});
  colEl.addEventListener('pointermove',function(e){if(!dragging)return;var dy=e.clientY-lastY;lastY=e.clientY;vy=dy;moved+=Math.abs(dy);y-=dy;apply();});
  function end(){dragging=false;colEl.classList.remove('grabbing');(function m(){vy*=0.93;if(Math.abs(vy)<0.4)return;y-=vy;apply();raf=requestAnimationFrame(m);})();}
  colEl.addEventListener('pointerup',function(e){if(!dragging)return;end();if(moved<5){var s=e.target.closest('.strip');if(s)onPick(parseInt(s.getAttribute('data-i')),s);}});
  colEl.addEventListener('pointercancel',end);
  apply();
}

var selPaint=null, selBoard=null;
function refreshDock(){
  if(selPaint!=null){el('dpsw').style.background=FB[selPaint][1];el('dpnm').textContent=FB[selPaint][0];}
  if(selBoard!=null){el('dbsw').style.backgroundImage="url('/showcase/finishes/"+BOARDS[selBoard].s+".webp')";el('dbnm').textContent=BOARDS[selBoard].n;}
  el('combine').disabled=(selPaint==null||selBoard==null);
}
function markSel(colEl,strip){colEl.querySelectorAll('.strip.sel').forEach(function(x){x.classList.remove('sel');});
  colEl.querySelectorAll('.strip').forEach(function(x){if(x.getAttribute('data-i')===strip.getAttribute('data-i'))x.classList.add('sel');});}

column(el('cpaint'), FB, function(c,i){return '<div class="strip" data-i="'+i+'" style="background:'+c[1]+'"><span class="lab">'+c[0]+'</span></div>';},
  function(i,s){selPaint=i;markSel(el('cpaint'),s);refreshDock();el('hint').style.opacity='0';});
column(el('cboard'), BOARDS, function(b,i){return '<div class="strip board" data-i="'+i+'" style="background-image:url(\'/showcase/finishes/'+b.s+'.webp\')"><span class="lab">'+b.n+'</span></div>';},
  function(i,s){selBoard=i;markSel(el('cboard'),s);refreshDock();el('hint').style.opacity='0';});

/* ---------- handles (placeholder silhouettes; swap for real Häfele/Hendel) ---------- */
var HANDLES=[
 {n:'Bar handle',svg:'<svg width="360" height="60"><rect x="6" y="24" width="348" height="12" rx="6" fill="#2b2b2b"/><rect x="30" y="6" width="12" height="24" rx="4" fill="#2b2b2b"/><rect x="318" y="6" width="12" height="24" rx="4" fill="#2b2b2b"/></svg>'},
 {n:'Knurled T-bar',svg:'<svg width="120" height="200"><rect x="52" y="10" width="16" height="180" rx="8" fill="#b98a2e"/><rect x="20" y="10" width="80" height="16" rx="8" fill="#b98a2e"/></svg>'},
 {n:'Bow handle',svg:'<svg width="120" height="200"><path d="M40 20 Q80 100 40 180" stroke="#c9cdd2" stroke-width="12" fill="none" stroke-linecap="round"/><circle cx="40" cy="20" r="9" fill="#c9cdd2"/><circle cx="40" cy="180" r="9" fill="#c9cdd2"/></svg>'},
 {n:'Edge pull',svg:'<svg width="80" height="200"><rect x="30" y="16" width="10" height="168" rx="5" fill="#3a3a3a"/></svg>'}
];
var hi=0, handleOn=false;
function drawHandle(){el('hview').innerHTML=HANDLES[hi].svg;el('hname').textContent='Handle · '+HANDLES[hi].n;}
el('hprev').onclick=function(){hi=(hi-1+HANDLES.length)%HANDLES.length;drawHandle();};
el('hnext').onclick=function(){hi=(hi+1)%HANDLES.length;drawHandle();};
el('bhandles').onclick=function(){handleOn=!handleOn;el('handles').classList.toggle('on',handleOn);if(handleOn)drawHandle();};

/* ---------- combine -> stage ---------- */
el('combine').onclick=function(){
  el('lp').style.background=FB[selPaint][1];
  el('lpc').textContent='Paint · '+FB[selPaint][0];
  el('rp').style.backgroundImage="url('/showcase/finishes/"+BOARDS[selBoard].s+".webp')";
  el('rpc').textContent='Board · '+BOARDS[selBoard].n;
  el('stage').classList.add('on');el('stbar').style.display='flex';setTimeout(showSuggest,700);
};
el('bclose').onclick=function(){el('stage').classList.remove('on');el('stbar').style.display='none';el('handles').classList.remove('on');handleOn=false;hideSuggest();};

/* ---------- snapshot to PNG ---------- */
var shots=[];
function snapshot(cb){
  var W=1600,H=1000,cv=document.createElement('canvas');cv.width=W;cv.height=H;var x=cv.getContext('2d');
  x.fillStyle=FB[selPaint][1];x.fillRect(0,0,W/2,H);
  var img=new Image();img.crossOrigin='anonymous';
  img.onload=function(){
    var iw=img.width,ih=img.height,tw=W/2,th=H,sc=Math.max(tw/iw,th/ih),dw=iw*sc,dh=ih*sc;
    x.drawImage(img,W/2+(tw-dw)/2,(th-dh)/2,dw,dh);
    // labels
    x.font='600 26px "IBM Plex Mono",monospace';
    x.fillStyle='rgba(253,252,248,.9)';x.fillRect(40,H-92,tw-80,52);x.fillStyle='#241f1a';x.fillText('PAINT · '+FB[selPaint][0],60,H-58);
    x.fillStyle='rgba(16,26,34,.6)';x.fillRect(W/2+40,H-92,tw-80,52);x.fillStyle='#fff';x.fillText('BOARD · '+BOARDS[selBoard].n,W/2+60,H-58);
    if(handleOn){var hsvg=new Image();hsvg.onload=function(){var hw=Math.min(520,W*0.4),hh=hw*(hsvg.height/hsvg.width);x.drawImage(hsvg,(W-hw)/2,(H-hh)/2,hw,hh);cb(cv);};hsvg.src='data:image/svg+xml;base64,'+btoa(HANDLES[hi].svg);}
    else cb(cv);
  };
  img.onerror=function(){cb(cv);};
  img.src='/showcase/finishes/'+BOARDS[selBoard].s+'.webp';
}
function fname(){return (FB[selPaint][0]+'__'+BOARDS[selBoard].n).replace(/[^a-z0-9]+/gi,'-')+'.png';}
el('bsnap').onclick=function(){snapshot(function(cv){var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=fname();a.click();});};
el('bshort').onclick=function(){snapshot(function(cv){var url=cv.toDataURL('image/png');shots.push({name:fname(),url:url});var im=document.createElement('img');im.src=url;el('thumbs').appendChild(im);el('tray').classList.add('on');});};

/* ---------- store-only ZIP ---------- */
var CRC=(function(){var t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){var c=0xFFFFFFFF;for(var i=0;i<u8.length;i++)c=CRC[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function dataURLtoU8(d){var b=atob(d.split(',')[1]);var u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function zip(files){
  var chunks=[],central=[],offset=0;
  function w16(v){return [v&255,(v>>8)&255];} function w32(v){return [v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255];}
  files.forEach(function(f){var name=[];for(var i=0;i<f.name.length;i++)name.push(f.name.charCodeAt(i));
    var data=f.data,c=crc32(data);
    var lh=[].concat(w32(0x04034b50),w16(20),w16(0),w16(0),w16(0),w16(0),w32(c),w32(data.length),w32(data.length),w16(name.length),w16(0),name);
    chunks.push(new Uint8Array(lh));chunks.push(data);
    var ch=[].concat(w32(0x02014b50),w16(20),w16(20),w16(0),w16(0),w16(0),w16(0),w32(c),w32(data.length),w32(data.length),w16(name.length),w16(0),w16(0),w16(0),w16(0),w32(0),w32(offset),name);
    central.push(new Uint8Array(ch));
    offset+=lh.length+data.length;});
  var csize=central.reduce(function(a,b){return a+b.length;},0);
  var end=new Uint8Array([].concat(w32(0x06054b50),w16(0),w16(0),w16(files.length),w16(files.length),w32(csize),w32(offset),w16(0)));
  var all=chunks.concat(central,[end]),total=all.reduce(function(a,b){return a+b.length;},0);
  var out=new Uint8Array(total),p=0;all.forEach(function(u){out.set(u,p);p+=u.length;});return out;
}
el('bzip').onclick=function(){
  if(!shots.length)return;
  var files=shots.map(function(s){return {name:s.name,data:dataURLtoU8(s.url)};});
  var blob=new Blob([zip(files)],{type:'application/zip'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sturij-pairings.zip';a.click();
};

/* Egger suggested complementary decors (placeholder set — wire the CDN feed when available) */
function showSuggest(){var row=el('srow');row.innerHTML='';
  var picks=BOARDS.filter(function(b){return b.s!==BOARDS[selBoard].s;}).sort(function(){return Math.random()-.5;}).slice(0,6);
  picks.forEach(function(b){var c=document.createElement('div');c.className='scard';
    c.innerHTML='<div class="si" style="background-image:url(\'/showcase/finishes/'+b.s+'.webp\')"></div><div class="sn">'+b.n+'</div>';
    c.onclick=function(){selBoard=BOARDS.indexOf(b);el('rp').style.backgroundImage="url('/showcase/finishes/"+b.s+".webp')";el('rpc').textContent='Board \u00b7 '+b.n;refreshDock();showSuggest();};
    row.appendChild(c);});
  var sg=el('suggest');sg.classList.add('on');requestAnimationFrame(function(){sg.classList.add('show');});}
function hideSuggest(){var sg=el('suggest');sg.classList.remove('show');setTimeout(function(){sg.classList.remove('on');},600);}
el('sx').onclick=hideSuggest;
</script>
