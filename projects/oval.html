 :root{--navy:#20384a;--gold:#d4aa58;--bronze:#8b5e2c;--paper:#faf8f2;--paper-warm:#f0ece4;--ink:#241f1a;--ink-body:#3d3830;--ink-muted:#6b6358;--line-soft:rgba(35,31,27,.07);--nav:66px;--f-serif:'DM Serif Display',Georgia,serif;--f-sans:'DM Sans',system-ui,sans-serif;--f-mono:'IBM Plex Mono',monospace;--ease-out:cubic-bezier(.2,.7,.3,1)}
 *{box-sizing:border-box}body{margin:0;font-family:var(--f-sans);color:var(--ink-body);background:var(--paper);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
 h1,h2{font-family:var(--f-serif);font-weight:400;color:var(--ink);margin:0}
 .nav{position:fixed;inset:0 0 auto 0;height:var(--nav);z-index:50;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,40px)}
 .brand{font-family:var(--f-serif);color:var(--paper);font-size:26px;text-decoration:none}.brand i{color:var(--gold);font-style:normal}
 .nav a.back{font-family:var(--f-mono);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);text-decoration:none;border:1px solid var(--gold);border-radius:999px;padding:8px 15px}
 .hero{position:relative;min-height:82vh;display:flex;align-items:flex-end;margin-top:var(--nav);overflow:hidden}
 .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
 .hero .scr{position:absolute;inset:0;background:linear-gradient(to top,rgba(16,26,34,.72),rgba(16,26,34,.05) 55%,transparent)}
 .hero .cap{position:relative;z-index:2;padding:clamp(28px,6vw,72px);max-width:900px}
 .hero .k{font-family:var(--f-mono);font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
 .hero h1{color:var(--paper);font-size:clamp(40px,8vw,88px);line-height:1.02;margin:12px 0 0;text-shadow:0 2px 30px rgba(0,0,0,.4)}
 .intro{max-width:760px;margin:0 auto;padding:clamp(44px,7vw,84px) clamp(18px,5vw,40px) clamp(20px,3vw,30px)}
 .intro p{font-size:clamp(19px,2.4vw,25px);line-height:1.45;color:var(--ink-heading,#332e27);text-wrap:balance;margin:0}
 .gal{max-width:1180px;margin:0 auto;padding:clamp(20px,3vw,30px) clamp(12px,3vw,26px) clamp(60px,10vw,120px);display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(8px,1.2vw,14px);grid-auto-flow:dense}
 .gal figure{margin:0;position:relative;overflow:hidden;border-radius:12px;grid-column:span 2;aspect-ratio:3/2;opacity:0;transform:translateY(24px);transition:opacity .8s var(--ease-out),transform .8s var(--ease-out)}
 .gal figure.in{opacity:1;transform:none}
 .gal figure.w3{grid-column:span 3}.gal figure.w4{grid-column:span 4;aspect-ratio:16/9}.gal figure.t{grid-row:span 2;aspect-ratio:3/4}
 .gal img{width:100%;height:100%;object-fit:cover;display:block}
 @media(max-width:820px){.gal{grid-template-columns:repeat(2,1fr)}.gal figure,.gal figure.w3,.gal figure.w4{grid-column:span 2}.gal figure.w4{aspect-ratio:3/2}}
 .cta{background:var(--navy);color:var(--paper);text-align:center;padding:clamp(50px,8vw,96px) 20px}
 .cta h2{color:var(--paper);font-size:clamp(28px,4.4vw,44px)}
 .cta a{display:inline-block;margin-top:22px;font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);background:var(--gold);border-radius:999px;padding:14px 26px;text-decoration:none}
 .more{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:26px}
 .more a{font-family:var(--f-mono);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(250,248,242,.72);text-decoration:none;border:1px solid rgba(250,248,242,.3);border-radius:999px;padding:10px 16px}
 .more a:hover{color:var(--gold);border-color:var(--gold)}
 @media(prefers-reduced-motion:reduce){.gal figure{opacity:1;transform:none}}
